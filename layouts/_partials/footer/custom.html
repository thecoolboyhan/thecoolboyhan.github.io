{{/* ===== 顶部阅读进度条 ===== */}}
<div class="reading-progress-bar" id="reading-progress-bar"></div>

{{/* ===== 返回顶部按钮 ===== */}}
<button id="back-to-top" aria-label="返回顶部" title="返回顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
</button>

<script>
    (function () {
        // 阅读进度条
        var bar = document.getElementById('reading-progress-bar');
        // 返回顶部按钮
        var btn = document.getElementById('back-to-top');

        var onScroll = function () {
            var doc = document.documentElement;
            var scrollTop = doc.scrollTop || document.body.scrollTop;
            var scrollHeight = doc.scrollHeight - doc.clientHeight;

            if (bar) {
                var percent = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
                bar.style.width = percent + '%';
            }
            if (btn) {
                if (scrollTop > 400) btn.classList.add('show');
                else btn.classList.remove('show');
            }
        };

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);

        if (btn) {
            btn.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        onScroll();
    })();
</script>

{{/* ===== 点击图片放大（灯箱） ===== */}}
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
    <div class="lightbox-backdrop" data-close></div>
    <button class="lightbox-close" type="button" aria-label="关闭" title="关闭 (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
        </svg>
    </button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="上一张" title="上一张 (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
        </svg>
    </button>
    <img class="lightbox-image" alt="">
    <button class="lightbox-nav lightbox-next" type="button" aria-label="下一张" title="下一张 (→)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6" />
        </svg>
    </button>
    <div class="lightbox-caption"></div>
    <div class="lightbox-counter"></div>
</div>

<script>
    (function () {
        var box = document.getElementById('lightbox');
        if (!box) return;

        var boxImg = box.querySelector('.lightbox-image');
        var caption = box.querySelector('.lightbox-caption');
        var counter = box.querySelector('.lightbox-counter');
        var btnClose = box.querySelector('.lightbox-close');
        var btnPrev = box.querySelector('.lightbox-prev');
        var btnNext = box.querySelector('.lightbox-next');

        var images = [];
        var index = 0;
        var lastFocused = null;

        var decodeEntities = function (s) {
            return s.replace(/&amp;/g, '&').replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
        };

        var render = function () {
            var img = images[index];
            if (!img) return;
            boxImg.src = img.getAttribute('data-zoom-src') || img.src;
            boxImg.alt = img.alt || '';
            var title = img.getAttribute('data-title-escaped') || img.title || '';
            caption.textContent = title ? decodeEntities(title) : (img.alt || '');
            caption.hidden = !caption.textContent;
            counter.textContent = (index + 1) + ' / ' + images.length;
            var multi = images.length > 1;
            btnPrev.hidden = !multi;
            btnNext.hidden = !multi;
        };

        var open = function (imgEl) {
            images = Array.prototype.slice.call(document.querySelectorAll('.article-content img'));
            index = images.indexOf(imgEl);
            if (index < 0) return;
            lastFocused = document.activeElement;
            render();
            box.hidden = false;
            document.body.style.overflow = 'hidden';
            btnClose.focus();
        };

        var close = function () {
            box.hidden = true;
            boxImg.removeAttribute('src');
            document.body.style.overflow = '';
            if (lastFocused && lastFocused.focus) lastFocused.focus();
        };

        var step = function (delta) {
            if (images.length < 2) return;
            index = (index + delta + images.length) % images.length;
            render();
        };

        // 事件委托：gallery.ts 之后 DOM 会被重构成 figure > a > img，委托可覆盖动态变化
        document.addEventListener('click', function (e) {
            var img = e.target.closest && e.target.closest('.article-content img');
            if (!img) return;
            e.preventDefault();
            open(img);
        });

        btnClose.addEventListener('click', close);
        btnPrev.addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
        btnNext.addEventListener('click', function (e) { e.stopPropagation(); step(1); });

        box.addEventListener('click', function (e) {
            if (e.target === box || e.target.hasAttribute('data-close')) close();
        });

        document.addEventListener('keydown', function (e) {
            if (box.hidden) return;
            if (e.key === 'Escape') close();
            else if (e.key === 'ArrowLeft') step(-1);
            else if (e.key === 'ArrowRight') step(1);
        });
    })();
</script>
