name: Build and deploy
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.97.1
      GO_VERSION: 1.25.5
      # Hugo 版本在此处唯一定义，下方 Setup Hugo 通过 env 引用。
      #
      # ⚠️ 下限是 0.158.0，不要下调：
      # 主题 v4.0.3 的 layouts/baseof.html:2 与 layouts/rss.xml:33 使用了
      # `.Site.Language.Locale`，该字段自 Hugo 0.158.0 起才存在
      # （与 languageCode -> locale 的更名同期）。锁到 0.154.2 会让
      # **全站每一页**渲染失败：
      #   can't evaluate field Locale in type *langs.Language
      # 本地验证版本 = 0.166.0，CI 与之保持一致。
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Hugo 模块走 --cacheDir 自己的缓存，这里关掉 setup-go 的默认缓存
          cache: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          # 主题 v4 依赖 Hugo >= 0.158.0 的 .Site.Language.Locale 字段。
          # 在这里显式拦截，避免把版本调低后直到渲染阶段才发现全站失败。
          HUGO_VER="$(hugo version | sed -E 's/^hugo v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          MIN_VER="0.158.0"
          if [ "$(printf '%s\n%s\n' "$MIN_VER" "$HUGO_VER" | sort -V | head -n1)" != "$MIN_VER" ]; then
            echo "::error::Hugo ${HUGO_VER} 低于最低要求 ${MIN_VER}：主题 v4 的 baseof.html/rss.xml 使用了 .Site.Language.Locale，构建会全站失败"
            exit 1
          fi
          echo "Hugo ${HUGO_VER} 满足最低要求 ${MIN_VER}"
      - name: Configure Git
        run: |
          git config core.quotepath false

      # 缓存 key 必须由内容决定。
      # 原先写的是 key: hugo-${{ github.run_id }}（每次运行都唯一），导致：
      #   1) save 时复用 restore 出来的旧 primary key，缓存内容永远不刷新；
      #   2) 未命中时每次新增一条缓存记录，很快吃满仓库的 Actions 缓存配额。
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('go.sum', 'config/**', 'assets/**') }}
          restore-keys: |
            hugo-${{ runner.os }}-
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache save
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('go.sum', 'config/**', 'assets/**') }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
